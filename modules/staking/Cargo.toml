[package]
name = "pallet-staking"
version = "4.0.0-dev"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/substrate/"
description = "FRAME pallet staking"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
serde = { version = "1.0.136", optional = true }
codec = { package = "parity-scale-codec", version = "3.2.2", default-features = false, features = [
	"derive",
] }
scale-info = { version = "2.5.0", default-features = false, features = ["derive"] }
sp-std = { workspace = true ,default-features = false }
sp-io =  { workspace = true ,default-features = false }
sp-runtime =  { workspace = true ,default-features = false }
sp-staking =  { workspace = true ,default-features = false }
frame-support =  { workspace = true ,default-features = false }
frame-system = { workspace = true ,default-features = false }
pallet-session = { version = "4.0.0-dev", default-features = false, features = [
	"historical",
], workspace = true }
pallet-authorship = { version = "4.0.0-dev",  workspace = true ,default-features = false }
sp-application-crypto = { version = "7.0.0", workspace = true ,default-features = false }
frame-election-provider-support = { version = "4.0.0-dev",workspace = true ,default-features = false }
log = { version = "0.4.17", default-features = false }

# Optional imports for benchmarking
frame-benchmarking = { version = "4.0.0-dev", default-features = false, workspace = true,  optional = true }
rand_chacha = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
# sp-tracing = { version = "6.0.0", workspace = true }
# sp-core = { version = "7.0.0", workspace = true }
# # sp-npos-elections = { version = "4.0.0-dev", workspace = true }
# pallet-balances = { version = "4.0.0-dev", workspace = true }
# pallet-timestamp = { version = "4.0.0-dev",  workspace = true }
# pallet-staking-reward-curve = { version = "4.0.0-dev",  workspace = true }
# pallet-bags-list = { version = "4.0.0-dev", workspace = true }
# substrate-test-utils = { version = "4.0.0-dev", workspace = true }
# frame-benchmarking = { version = "4.0.0-dev",  workspace = true }
# frame-election-provider-support = { version = "4.0.0-dev",  workspace = true }
# rand_chacha = { version = "0.2" }

[features]
default = ["std"]
std = [
	"frame-benchmarking?/std",
	"serde",
	"codec/std",
	"scale-info/std",
	"sp-std/std",
	"sp-io/std",
	"frame-support/std",
	"sp-runtime/std",
	"sp-staking/std",
	"pallet-session/std",
	"frame-system/std",
	"pallet-authorship/std",
	"sp-application-crypto/std",
	"log/std",
	"frame-election-provider-support/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-election-provider-support/runtime-benchmarks",
	"rand_chacha",
	"sp-staking/runtime-benchmarks",
]
try-runtime = ["frame-support/try-runtime", "frame-election-provider-support/try-runtime"]
