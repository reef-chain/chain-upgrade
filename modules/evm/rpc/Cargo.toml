[package]
name = "evm-rpc"
version = "0.1.0"
authors = ["Reef Developers"]
edition = "2021"

[dependencies]
jsonrpsee = { version = "0.16.2", features = ["server","macros"] }
jsonrpc-core = "18.0.0"
jsonrpc-derive = "18.0.0"
ethereum-types = { version = "0.14.0", features = ["scale-info"] }
sp-api = { workspace = true ,default-features = false } 
sp-blockchain= { workspace = true , default-features = false } 
sp-core= { workspace = true ,default-features = false } 
sp-io= { workspace = true ,default-features = false } 
sp-rpc = { workspace = true ,default-features = false } 
sc-rpc-api=  { git = "https://github.com/paritytech/substrate", branch = "polkadot-v0.9.43" }
sp-runtime= { workspace = true ,default-features = false } 
sp-storage= { workspace = true ,default-features = false } 
# sp-transaction-pool= { workspace = true ,default-features = false } 
# sc-service= { workspace = true ,default-features = false } 
# sc-client-api= { workspace = true ,default-features = false } 
# sc-rpc= { workspace = true ,default-features = false } 
# sc-network= { workspace = true ,default-features = false } 
rustc-hex = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
module-evm-rpc-runtime-api = { path = "runtime_api" }
module-evm = { path = ".." }
pallet-transaction-payment-rpc-runtime-api = {git = "https://github.com/paritytech/substrate",default-features = false,branch = "polkadot-v0.9.43" }
frame-support= { workspace = true ,default-features = false } 
log = { version = "0.4.14", default-features = false }

[dev-dependencies]
serde_json = "1.0.41"

[features]
default = [ "rpc_binary_search_estimate" ]
rpc_binary_search_estimate = []
std = []